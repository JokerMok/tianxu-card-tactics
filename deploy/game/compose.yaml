services:
  tianxu:
    build:
      context: ${TIANXU_BUILD_CONTEXT:-../../.local/game-runtime}
      dockerfile: deploy/game/Dockerfile
    image: ${TIANXU_IMAGE:-tianxu-game:local}
    user: "${TIANXU_UID:-1000}:${TIANXU_GID:-1000}"
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${TIANXU_NODE_OPTIONS:---max-old-space-size=512}
      TIANXU_PUBLIC_ORIGIN: ${TIANXU_PUBLIC_ORIGIN:-}
      TIANXU_TRUSTED_PROXY: ${TIANXU_TRUSTED_PROXY:-}
      TIANXU_CONTENT_DIR: ${TIANXU_CONTENT_DIR:-/srv/tianxu/cocos-client/assets/resources/recovered}
      TIANXU_WEB_DIR: ${TIANXU_WEB_DIR:-/srv/tianxu/.local/web}
      TIANXU_UI_DIR: ${TIANXU_UI_DIR:-/srv/tianxu/cocos-client/assets/resources/ui-revision-a}
      TIANXU_LOCALIZATION_DIR: ${TIANXU_LOCALIZATION_DIR:-/srv/tianxu/cocos-client/assets/resources/localization}
      TIANXU_DATABASE: ${TIANXU_DATABASE:-/var/lib/tianxu/tianxu.sqlite}
      TIANXU_PORT: ${TIANXU_PORT:-7400}
      TIANXU_HOST: ${TIANXU_HOST:-0.0.0.0}
      TIANXU_LOG_DIR: ${TIANXU_LOG_DIR:-/var/log/tianxu}
    ports:
      - "127.0.0.1:${TIANXU_PUBLISHED_PORT:-7400}:${TIANXU_PORT:-7400}"
    volumes:
      - type: bind
        source: ${TIANXU_CONFIG_DIR:-../../.local/deploy/config}
        target: /etc/tianxu
        read_only: true
      - type: bind
        source: ${TIANXU_DATA_DIR:-../../.local/deploy/data}
        target: /var/lib/tianxu
      - type: bind
        source: ${TIANXU_LOG_HOST_DIR:-../../.local/deploy/logs}
        target: /var/log/tianxu
      - type: bind
        source: ${TIANXU_BACKUP_DIR:-../../.local/deploy/backups}
        target: /var/backups/tianxu
    stop_grace_period: 30s
    mem_limit: ${TIANXU_MEMORY_LIMIT:-768m}
    cpus: ${TIANXU_CPUS:-1.0}
    pids_limit: 128
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  default:
    ipam:
      config:
        - subnet: ${TIANXU_SUBNET:-10.238.75.0/28}
